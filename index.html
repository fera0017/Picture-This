<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Picture This!</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <div class="title">
      <h1>Picture This!</h1>
      <h4>My Really Cool Blog Post</h4>
    </div>
    <!-- Replaced static image with responsive picture element to handle images across different screen sizes as the question said  -->
    <!--  the picture element lets the browser choose an image for each screen size
     At 960px and wider the source loads the square images sizes="50vw" tells
     the browser the image is half the screen wide so it picks a sharp file that
     is not too big srcset lists each file with its real width Below 960px
     the img loads the landscape images at full width  -->
    <picture>
      <source
        media="(min-width: 960px)"
        srcset="images/square-480.jpg 480w,
                images/square-640.jpg 640w,
                images/square-800.jpg 800w,
                images/square-960.jpg 960w,
                images/square-1280.jpg 1280w,
                images/square-1440.jpg 1440w,
                images/square-1600.jpg 1600w,
                images/square-1920.jpg 1920w,
                images/square-2400.jpg 2400w"
        sizes="50vw">
      <img
        src="images/landscape-960.jpg"
        srcset="images/landscape-320.jpg 320w,
                images/landscape-480.jpg 480w,
                images/landscape-640.jpg 640w,
                images/landscape-720.jpg 720w,
                images/landscape-960.jpg 960w,
                images/landscape-1440.jpg 1440w,
                images/landscape-1920.jpg 1920w,
                images/landscape-2160.jpg 2160w,
                images/landscape-2880.jpg 2880w"
        sizes="100vw"
        alt="Grand museum gallery with green walls covered in framed paintings and blue sofas in the middle of the room">
    </picture>
  </header>
</body>

</html>
